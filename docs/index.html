<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="친구랑 만나면 바로 시작할 수 있는 요즘 놀이 큐레이션">
  <title>놀자 연구소 — 오늘은 뭐 하고 놀까?</title>
  <style>
    :root{--ink:#172b45;--cream:#fffaf1;--coral:#ff684d;--line:#e9dfd1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Malgun Gothic","Trebuchet MS",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 48px));margin:auto}.nav{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:20px;font-weight:900}.logo i{color:var(--coral);font-style:normal;font-size:27px}.navlinks{display:flex;gap:28px;align-items:center;font-size:13px;font-weight:800}.navlinks button{background:transparent;color:var(--ink)}.hero{min-height:510px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px}.eyebrow{color:var(--coral);font-size:11px;font-weight:900;letter-spacing:2px}.hero h1{font-size:clamp(54px,7vw,88px);letter-spacing:-6px;line-height:.95;margin:18px 0 28px}.hero em,h2 em{color:var(--coral);font-style:normal}.desc{color:#637285;line-height:1.8}.primary{display:inline-flex;background:var(--ink);color:#fff;padding:15px 20px;margin-top:16px;font-weight:800}.art{height:360px;position:relative;overflow:hidden;background:#dff1ef;border-radius:48% 52% 42% 58%/50% 45% 55% 50%;transform:rotate(3deg)}.blob{position:absolute;border-radius:50%}.one{width:180px;height:220px;background:#ff8d74;left:18%;bottom:-55px}.two{width:130px;height:145px;background:#ffd45c;right:16%;bottom:-25px}.sun{position:absolute;right:15%;top:9%;font-size:48px;color:#ffbd3f}.sticker{position:absolute;left:37%;top:24%;padding:14px;background:var(--ink);color:white;transform:rotate(-10deg);font-weight:900}.sticker b{color:#ffd45c}.content{padding:72px 0 100px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}.heading h2,.guide h2{font-size:42px;line-height:1.1;letter-spacing:-2.5px;margin:12px 0 0}.random{background:transparent;color:var(--coral);border-bottom:1px solid var(--coral);padding:8px 0;font-weight:900}.toolbar{display:flex;justify-content:space-between;gap:18px;padding:16px 0;border-block:1px solid var(--line);margin-bottom:28px}.search{flex:1;max-width:350px;background:transparent;border:0;outline:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{padding:8px 14px;border-radius:20px;background:transparent;color:#897e74;font-size:12px;font-weight:800}.filters button.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:325px;padding:20px;display:flex;flex-direction:column;transition:.2s}.card:hover{transform:translateY(-5px)}.peach{background:#ffd9cc}.blue{background:#cfe7ee}.yellow{background:#ffedab}.mint{background:#d7ebd1}.lavender{background:#dfd7ee}.pink{background:#f7d1dd}.top{display:flex;justify-content:space-between}.heart{background:transparent;font-size:25px}.heart.on{color:var(--coral)}.icon{height:90px;display:grid;place-items:center;font:800 56px Georgia}.tag{font-size:10px;font-weight:900;opacity:.6}.card h3{font-size:25px;margin:7px 0}.card p{font-size:12px;line-height:1.55;opacity:.75}.copy{flex:1}.meta{display:flex;gap:15px;padding-top:12px;border-top:1px solid #172b4530;font-size:11px}.tip{font-size:10px;margin-top:12px}.guide{background:var(--ink);color:white;padding:70px 0}.guidein{display:flex;justify-content:space-between;align-items:center}.rules{display:flex;gap:38px}.rules div{display:flex;gap:10px;font-size:12px;line-height:1.6}.rules b{color:#ffbd3f}.footer{height:90px;display:flex;align-items:center;justify-content:space-between;color:#958b81;font-size:11px}.modal{position:fixed;inset:0;background:#172b4590;display:none;place-items:center;padding:24px}.modal.show{display:grid}.box{width:min(400px,100%);padding:38px;background:#ffd9cc;text-align:center;position:relative}.close{position:absolute;right:14px;top:10px;background:transparent;font-size:26px}.box h2{font-size:34px}.empty{padding:60px;text-align:center;color:#897e74}@media(max-width:760px){.wrap{width:min(100% - 32px,560px)}.navlinks a{display:none}.hero{grid-template-columns:1fr;padding:60px 0}.art{height:260px}.heading,.toolbar,.guidein{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.rules{flex-direction:column;gap:18px}.footer{height:auto;padding:28px 0;gap:12px;flex-wrap:wrap}}
  </style>
</head>
<body>
  <nav class="nav wrap"><a class="logo" href="#top"><i>●</i> 놀자 연구소</a><div class="navlinks"><a href="#plays">오늘의 놀이</a><a href="#guide">놀이 가이드</a><button id="savedBtn">♡ 찜한 놀이 <b id="savedCount">0</b></button></div></nav>
  <main>
    <section class="hero wrap" id="top"><div><p class="eyebrow">PLAYGROUND REPORT</p><h1>오늘은 뭐 하고<br><em>놀까?</em></h1><p class="desc">친구랑 만나면 바로 시작할 수 있는<br>요즘 놀이를 한곳에 모았어요.</p><a class="primary" href="#plays">놀이 둘러보기 ↘</a></div><div class="art"><span class="sun">✳</span><span class="blob one"></span><span class="blob two"></span><span class="sticker">LET'S<br><b>PLAY!</b></span></div></section>
    <section class="content wrap" id="plays"><div class="heading"><div><p class="eyebrow">FIND YOUR PLAY</p><h2>지금 끌리는 놀이를<br><em>찾아봐요</em></h2></div><button class="random" id="randomBtn">✦ 뭐 하지? 랜덤 추천</button></div><div class="toolbar"><input class="search" id="search" aria-label="놀이 검색" placeholder="⌕ 놀이 이름이나 키워드를 검색해 보세요"><div class="filters" id="filters"></div></div><div class="grid" id="grid"></div></section>
    <section class="guide" id="guide"><div class="wrap guidein"><div><p class="eyebrow">PLAY NICE, PLAY SAFE</p><h2>잘 노는 것도<br><em>멋진 실력</em>이에요.</h2></div><div class="rules"><div><b>01</b><span>친구가 싫다고 하면<br>바로 멈춰요.</span></div><div><b>02</b><span>차례와 규칙은<br>함께 정해요.</span></div><div><b>03</b><span>끝나면 함께<br>정리해요.</span></div></div></div></section>
  </main>
  <footer class="footer wrap"><b>놀자 연구소</b><span>매일 새롭게, 함께 즐겁게.</span><span>PLAY LAB</span></footer>
  <div class="modal" id="modal"><div class="box"><button class="close" id="close" aria-label="닫기">×</button><p class="eyebrow">TODAY'S PICK</p><div class="icon" id="modalIcon"></div><h2 id="modalTitle"></h2><p id="modalDesc"></p><button class="primary" id="ok">좋아, 해볼래!</button></div></div>
  <script>
    const plays=[
      {title:'키링 공방',tag:'만들기',people:'1–3명',time:'20분',color:'peach',icon:'✦',desc:'비즈와 참을 골라 나만의 가방 키링을 완성해요.',tip:'작은 부품은 어른과 함께 확인해요.'},
      {title:'딱지 배틀',tag:'승부',people:'2–4명',time:'10분',color:'blue',icon:'▰',desc:'종이 한 장으로 만들고, 바닥에 톡! 누가 더 멀리 뒤집을까요?',tip:'사람을 향해 던지지 않아요.'},
      {title:'보드게임 카페',tag:'전략',people:'2–6명',time:'30분',color:'yellow',icon:'♟',desc:'친구들과 규칙을 정하고, 한 판만 더를 외쳐봐요.',tip:'처음 하는 친구에게 천천히 알려줘요.'},
      {title:'줄넘기 챌린지',tag:'움직이기',people:'2–8명',time:'15분',color:'mint',icon:'∿',desc:'기본 뛰기부터 2단 뛰기까지, 오늘의 기록에 도전해요.',tip:'주변에 부딪힐 물건이 없는지 살펴요.'},
      {title:'종이 미니어처',tag:'만들기',people:'1–2명',time:'40분',color:'lavender',icon:'⌂',desc:'상상 속 방을 그리고 접어서 작은 세계를 만들어요.',tip:'가위는 자리에 앉아서 사용해요.'},
      {title:'몸으로 말해요',tag:'웃음',people:'4–10명',time:'15분',color:'pink',icon:'?!',desc:'말 없이 몸짓만으로 제시어를 설명해요. 타이머는 60초!',tip:'서로의 공간을 지켜요.'}
    ];
    const filters=['전체','만들기','움직이기','전략','웃음','승부'];let active='전체',saved=[],savedOnly=false;
    const grid=document.querySelector('#grid'),search=document.querySelector('#search');
    function render(){const q=search.value.toLowerCase(),visible=plays.filter(p=>(active==='전체'||p.tag===active)&&(`${p.title} ${p.desc} ${p.tag}`).toLowerCase().includes(q)&&(!savedOnly||saved.includes(p.title)));grid.innerHTML=visible.length?visible.map((p,i)=>`<article class="card ${p.color}"><div class="top"><small>0${i+1}</small><button class="heart ${saved.includes(p.title)?'on':''}" data-save="${p.title}" aria-label="${p.title} 찜하기">${saved.includes(p.title)?'♥':'♡'}</button></div><div class="icon">${p.icon}</div><div class="copy"><span class="tag">${p.tag}</span><h3>${p.title}</h3><p>${p.desc}</p></div><div class="meta"><span>♧ ${p.people}</span><span>◷ ${p.time}</span></div><div class="tip"><b>TIP</b> ${p.tip}</div></article>`).join(''):'<div class="empty">조건에 맞는 놀이가 없어요.</div>';document.querySelector('#savedCount').textContent=saved.length;document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{saved=saved.includes(b.dataset.save)?saved.filter(x=>x!==b.dataset.save):[...saved,b.dataset.save];render()})}
    document.querySelector('#filters').innerHTML=filters.map(f=>`<button class="${f==='전체'?'active':''}" data-filter="${f}">${f}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});search.oninput=render;document.querySelector('#savedBtn').onclick=()=>{savedOnly=!savedOnly;render()};
    const modal=document.querySelector('#modal');document.querySelector('#randomBtn').onclick=()=>{const p=plays[Math.floor(Math.random()*plays.length)];document.querySelector('#modalIcon').textContent=p.icon;document.querySelector('#modalTitle').innerHTML=`오늘은<br><em>${p.title}</em> 어때요?`;document.querySelector('#modalDesc').textContent=p.desc;modal.classList.add('show')};document.querySelector('#close').onclick=document.querySelector('#ok').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};render();
  </script>
</body>
</html>
